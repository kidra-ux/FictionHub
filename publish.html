<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Publish - FictionHub</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background-color: #050505; color: #ffffff; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; padding: 20px 16px; }
        header { display: flex; align-items: center; padding-bottom: 20px; border-bottom: 1px solid #1a1a1a; margin-bottom: 30px; }
        .back-link { color: #9e1638; text-decoration: none; font-size: 14px; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; }
        h1 { font-family: Georgia, serif; font-size: 32px; font-weight: 400; margin-bottom: 25px; }
        .form-group { margin-bottom: 20px; }
        label { display: block; font-size: 11px; color: #666; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px; }
        input[type="text"], input[type="file"], select, textarea {
            width: 100%; background-color: #0a0a0a; border: 1px solid #222; color: #ffffff; padding: 12px; font-size: 16px; border-radius: 4px; font-family: inherit;
        }
        input[type="file"] { padding: 8px; }
        input[type="text"]:focus, select:focus, textarea:focus { border-color: #9e1638; outline: none; }
        textarea { min-height: 200px; resize: vertical; }
        .btn-submit { background-color: #9e1638; color: white; border: none; width: 100%; padding: 16px; font-size: 14px; font-weight: 600; letter-spacing: 1px; text-transform: uppercase; border-radius: 2px; cursor: pointer; margin-top: 10px; }
        .success-message { display: none; background-color: #0f2d19; border: 1px solid #1e5c32; color: #52c47c; padding: 15px; border-radius: 4px; margin-bottom: 20px; font-size: 14px; text-align: center; }
    </style>
</head>
<body>
    <header><a href="index.html" class="back-link">← Back to Home</a></header>
    <h1>Publish Content</h1>
    <div id="successNotice" class="success-message">🎉 Published successfully! Check the Home page.</div>
    
    <form id="storyForm">
        <div class="form-group">
            <label for="publishType">What are you publishing?</label>
            <select id="publishType" required onchange="togglePublishType()">
                <option value="new">A Brand New Story / Comic</option>
                <option value="chapter">A New Chapter for an Existing Story</option>
            </select>
        </div>

        <div class="form-group">
            <label for="storyTitle">Story Title</label>
            <input type="text" id="storyTitle" placeholder="Enter story title..." required>
            <!-- Lista dinamica per selezionare la storia se si aggiunge un capitolo -->
            <select id="existingStorySelect" style="display: none;"></select>
        </div>

        <div id="newStoryFields">
            <div class="form-group">
                <label for="storyAuthor">Author Name</label>
                <input type="text" id="storyAuthor" placeholder="Your username..." required>
            </div>
            <div class="form-group">
                <label for="storyCoverFile">Upload Cover Image</label>
                <input type="file" id="storyCoverFile" accept="image/*">
            </div>
            <div class="form-group">
                <label for="storyCategory">Category</label>
                <select id="storyCategory">
                    <option value="kids">For kids</option>
                    <option value="teens">For teens</option>
                    <option value="adults">For adults</option>
                </select>
            </div>
        </div>

        <div id="chapterFields" style="display: none;">
            <div class="form-group">
                <label for="chapterNumber">Chapter Number / Name</label>
                <input type="text" id="chapterNumber" placeholder="e.g. Chapter 2, Act II...">
            </div>
        </div>

        <div class="form-group">
            <label for="storyContent">Content (Text or Comic description)</label>
            <textarea id="storyContent" placeholder="Write your content here..." required></textarea>
        </div>
        
        <button type="submit" class="btn-submit">Publish Now</button>
    </form>

    <script>
        // Carica le storie esistenti se si vuole aggiungere un capitolo
        function togglePublishType() {
            const type = document.getElementById('publishType').value;
            const newFields = document.getElementById('newStoryFields');
            const chapFields = document.getElementById('chapterFields');
            const titleInput = document.getElementById('storyTitle');
            const selectInput = document.getElementById('existingStorySelect');

            if (type === 'new') {
                newFields.style.display = 'block';
                chapFields.style.display = 'none';
                titleInput.style.display = 'block';
                selectInput.style.display = 'none';
                titleInput.required = true;
            } else {
                newFields.style.display = 'none';
                chapFields.style.display = 'block';
                titleInput.style.display = 'none';
                selectInput.style.display = 'block';
                titleInput.required = false;

                // Popola il menu a tendina con le storie esistenti
                const stories = JSON.parse(localStorage.getItem('userStories')) || [];
                if(stories.length === 0) {
                    alert("You haven't created any stories yet! Create a new story first.");
                    document.getElementById('publishType').value = 'new';
                    togglePublishType();
                    return;
                }
                selectInput.innerHTML = stories.map((s, idx) => `<option value="${idx}">${s.title} by ${s.author}</option>`).join('');
            }
        }

        document.getElementById('storyForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const type = document.getElementById('publishType').value;
            const fileInput = document.getElementById('storyCoverFile');
            const file = fileInput.files[0];

            function saveData(imageDataUrl = '') {
                let stories = JSON.parse(localStorage.getItem('userStories')) || [];
                const contentText = document.getElementById('storyContent').value;
                const dateStr = new Date().toLocaleDateString();

                if (type === 'new') {
                    // Crea una nuova struttura a capitoli
                    const newStory = {
                        title: document.getElementById('storyTitle').value,
                        author: document.getElementById('storyAuthor').value,
                        cover: imageDataUrl,
                        category: document.getElementById('storyCategory').value,
                        date: dateStr,
                        likes: 0,
                        comments: [],
                        chapters: [{ name: 'Chapter 1', content: contentText }]
                    };
                    stories.unshift(newStory);
                } else {
                    // Aggiunge un capitolo a una storia esistente
                    const selectedIdx = document.getElementById('existingStorySelect').value;
                    const chapName = document.getElementById('chapterNumber').value || `Chapter ${stories[selectedIdx].chapters.length + 1}`;
                    stories[selectedIdx].chapters.push({
                        name: chapName,
                        content: contentText
                    });
                }

                localStorage.setItem('userStories', JSON.stringify(stories));
                document.getElementById('successNotice').style.display = 'block';
                document.getElementById('storyForm').reset();
                togglePublishType();
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }

            if (type === 'new' && file) {
                const reader = new FileReader();
                reader.onloadend = () => saveData(reader.result);
                reader.readAsDataURL(file);
            } else {
                saveData('');
            }
        });
    </script>
</body>
</html>
